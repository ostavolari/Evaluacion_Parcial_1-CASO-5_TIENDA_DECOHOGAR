<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DECOHOGAR - Inicio Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/stylesheet.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="index.html">DECOHOGAR</a>
                <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="nav">
                    <div class="navbar-nav ms-auto">
                        <a class="nav-link" href="productos.html">Productos</a>
                        <a class="nav-link" href="nosotros.html">Nosotros</a>
                        <a class="nav-link" href="blogs.html">Blogs</a>
                        <a class="nav-link" href="contacto.html">Contacto</a>
                        <a class="nav-link" href="login.html">Ingresar</a>
                        <a class="nav-link" href="registro.html">Registrarse</a>
                        <a class="nav-link" href="carrito.html">Carrito <span class="badge rounded-pill text-bg-light text-dark cart-count">0</span></a>
                        <a class="nav-link" href="admin/index.html">Admin</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <main class="flex-grow-1">
        <section>
            <div class="container mt-5">
                <div class="row justify-content-center">
                    <div class="col-md-6 col-lg-4">
                        <article class="card">
                            <div class="card-body">
                                <h2>Inicio sesión</h2>
                                <form id="loginForm">
                                    <div class="mb-3">
                                        <label for="Correo" class="form-label">Correo</label>
                                        <input type="text" class="form-control" id="Correo" placeholder="usuario@duoc.cl" required>
                                        <div class="error-message" id="err-login-email"></div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="Contrasena" class="form-label">Contraseña</label>
                                        <input type="password" class="form-control" id="Contrasena" required>
                                        <div class="error-message" id="err-login-password"></div>
                                        <div class="d-grid mt-3">
                                            <button type="submit" class="btn btn-dark w-100">Iniciar Sesión</button>
                                        </div>
                                    </div>
                                </form>
                                <p class="text-center">¿No tienes una cuenta?
                                    <a href="registro.html">Regístrate aquí</a>
                                </p>
                            </div>
                        </article>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer class="bg-dark text-white text-center py-3">
        <p class = "mb-0">© 2026 DECOHOGAR</p>
    </footer>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast" class="toast" role="alert">
            <div class="d-flex">
                <div class="toast-body"></div>
                <button class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/login.js"></script>
</body>
</html>
