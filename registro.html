<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DECOHOGAR - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/stylesheet.css">
    <script src="assets/register.js" defer></script>
</head>

<body class="d-flex flex-column min-vh-100">
<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary">
        <div class="container">
            <a class="navbar-brand" href="index.html">DECOHOGAR</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Inicio</a>
                <a class="nav-link" href="login.html">Iniciar sesión</a>
            </div>
        </div>
    </nav>
</header>

<main class="flex-grow-1">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="text-center mb-4">Registro de Usuario</h2>

                        <form id="register-form" novalidate>
                            <!-- Datos Personales -->
                            <div class="mb-3">
                                <label for="reg-name" class="form-label">Nombre Completo</label>
                                <input type="text" class="form-control" id="reg-name" placeholder="Ej. Ana Silva">
                                <span class="text-danger small" id="err-reg-name"></span>
                            </div>

                            <div class="mb-3">
                                <label for="reg-email" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="reg-email" placeholder="usuario@duoc.cl">
                                <span class="text-danger small" id="err-reg-email"></span>
                            </div>

                            <div class="mb-3">
                                <label for="reg-password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="reg-password">
                                <span class="text-danger small" id="err-reg-password"></span>
                            </div>

                            <div class="mb-3">
                                <label for="reg-confirm" class="form-label">Confirmar Contraseña</label>
                                <input type="password" class="form-control" id="reg-confirm">
                                <span class="text-danger small" id="err-reg-confirm"></span>
                            </div>

                            <!-- Estilos de Preferencia -->
                            <div class="mb-3">
                                <label class="form-label fw-bold d-block">Estilos de Preferencia</label>
                                <div class="row g-2">
                                    <div class="col-6"><label><input type="checkbox" name="estilo" value="Minimalista"> Minimalista</label></div>
                                    <div class="col-6"><label><input type="checkbox" name="estilo" value="Industrial"> Industrial</label></div>
                                    <div class="col-6"><label><input type="checkbox" name="estilo" value="Nórdico"> Nórdico</label></div>
                                    <div class="col-6"><label><input type="checkbox" name="estilo" value="Vintage"> Vintage</label></div>
                                    <div class="col-6"><label><input type="checkbox" name="estilo" value="Rústico"> Rústico</label></div>
                                    <div class="col-6"><label><input type="checkbox" name="estilo" value="Moderno"> Moderno</label></div>
                                </div>
                                <span class="text-danger small d-block mt-1" id="err-reg-styles"></span>
                            </div>

                            <!-- Direcciones de Envío Dinámicas -->
                            <div class="mb-3 border-top pt-3">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <label class="form-label fw-bold mb-0">Direcciones de Envío</label>
                                    <button type="button" id="btn-add-address" class="btn btn-outline-dark btn-sm">
                                        + Agregar otra dirección
                                    </button>
                                </div>
                                <div id="address-container"></div>
                                <span class="text-danger small" id="err-reg-addresses"></span>
                            </div>

                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-dark">Completar Registro</button>
                                <a href="index.html" class="btn btn-outline-secondary">Volver al Inicio</a>
                            </div>
                        </form>

                        <p class="text-center mt-3 mb-0">
                            ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="bg-secondary text-white text-center py-3">
    <p class="mb-0">&copy; 2026 DECOHOGAR</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
